<style id="luxe-theme">
/* Open Sesame · Quiet luxury study, v0.2
   Type carries the hierarchy. Surface and ornament stay secondary. */
:root {
  --bg: #121214;
  --card: #1b1b1e;
  --card2: #232326;
  --line: #303034;
  --text: #f0ede7;
  --secondary: #c1bdc7;
  --muted: #a8a4af;
  --accent: #cbbfdb;
  --selected: #27232d;
  --pink: #cbb0b9;
  --green: #b9c3b4;
  --gold: #cdbfa9;
  --serif: 'EB Garamond', Georgia, serif;
  --sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  font-family: var(--sans);
  font-optical-sizing: auto;
  font-kerning: normal;
  -webkit-font-smoothing: antialiased;
}
body { background: #0c0c0e; }
button { font-weight: 400; }
svg { stroke-width: 1.4; }
h1, .serif, .brand, .header-brand, .sheet-title h2, .chat-intro h2, .note-item h3 {
  font-family: var(--serif);
  font-weight: 400;
  font-feature-settings: 'kern', 'liga';
}
h1 { font-size: 44px; line-height: 1.02; letter-spacing: -1.15px; }
h2 { font-size: 13px; font-weight: 500; letter-spacing: -.15px; }
h3 { font-weight: 500; }
.eyebrow { font-size: 9px; font-weight: 500; letter-spacing: 1.8px; line-height: 1.7; }
.small { line-height: 1.65; }
.primary { background: #d3c8de; color: #27212e; border-radius: 12px; font-size: 13px; font-weight: 500; letter-spacing: .1px; min-height: 52px; }
.primary svg { width: 18px; height: 18px; }
.secondary-button { border-radius: 11px; font-size: 12px; background: transparent; }
.text-button { font-size: 10px; font-weight: 400; color: var(--secondary); letter-spacing: .3px; }
.text-button:hover { color: var(--text); }
.pill { font-size: 9px; font-weight: 400; letter-spacing: .25px; border: 1px solid #403947; background: transparent; padding: 5px 8px; }
.avatar { background: transparent; border: 1px solid #4e4557; width: 33px; height: 33px; font-family: var(--serif); font-size: 19px; color: var(--accent); }
.presentation { gap: 110px; }
.intro { width: 350px; }
.brand { font-size: 31px; letter-spacing: -.75px; }
.brand .brand-dot { width: 4px; height: 4px; margin-left: 1px; }
.intro .brand { margin-bottom: 95px; }

<div class="presentation">
<aside class="intro" aria-label="About the prototype"><div class="brand"><svg class="coven-mark" aria-hidden="true"><use href="#i-coven-mark"/></svg><span>Open Sesame<span class="brand-dot"></span></span></div><span class="eyebrow">A workspace of your own</span><h1>A little space.<br><em>All your own.</em></h1><p>Thoughts, tools, and familiar company. Considered essentials. Always within reach.</p><div class="steps"><div><span>01</span>Catch the thought.</div><div><span>02</span>Find your focus.</div><div><span>03</span>Keep your familiar close.</div></div><p class="brand-promise">AI that can stay.</p><p class="footnote">OpenCoven · Interactive prototype</p></aside>
<div class="device"><div class="app">
<header class="header"><button class="header-brand" data-action="home" aria-label="Open Sesame home"><svg class="coven-mark" aria-hidden="true"><use href="#i-coven-mark"/></svg><span>Open Sesame<span class="brand-period">.</span></span></button><div class="row" style="gap:4px"><button class="icon-button" data-action="search" aria-label="Search your workspace"><svg><use href="#i-search"/></svg></button><button class="icon-button" data-action="settings" aria-label="Profile and prototype settings"><span class="avatar">V</span></button></div></header>
<main id="screen" class="screen" tabindex="-1" aria-label="Today"></main>
<nav class="nav" aria-label="Main navigation"></nav>
<div id="toast" class="toast hidden" role="status" aria-live="polite"></div>
</div></div></div>
<dialog id="sheet" aria-labelledby="sheet-heading"><div class="sheet" id="sheet-content"></div></dialog>
<script>
'use strict';
const STORAGE_KEY='opensesame.mobile.prototype.v1';
const $=s=>document.querySelector(s);
const icon=name=>`<svg ${name==='coven-mark'?'class="coven-mark"':''} aria-hidden="true"><use href="#i-${name}"/></svg>`;
const esc=value=>String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>globalThis.crypto?.randomUUID?.()||'item-'+Date.now()+'-'+Math.random().toString(36).slice(2);
const PROJECTS=['OpenCoven','River Oaks','Personal'];
const WIDGETS=[{id:'focus',name:'Focus timer',icon:'focus',desc:'A little room for deep work. Choose a duration and settle into one thing.'},{id:'notes',name:'Quick notes',icon:'note',desc:'Catch an idea before it slips away. Your latest note, always within reach.'},{id:'tasks',name:'Today’s tasks',icon:'tasks',desc:'Keep your next steps close. Check things off, one small win at a time.'},{id:'reader',name:'Reading list',icon:'book',desc:'Save the links you want to come back to. Less searching, more reading.'},{id:'clock',name:'World clock',icon:'clock',desc:'A small window into another time zone. Houston and London, at a glance.'}];
function freshState(){return{version:1,items:[{id:'task-1',type:'task',title:'Shape the Open Sesame mobile experience',project:'OpenCoven',done:false,created:1},{id:'task-2',type:'task',title:'Review the Ribbonwing boarding flow',project:'River Oaks',done:false,created:2},{id:'task-3',type:'task',title:'Make room for one good idea',project:'Personal',done:true,created:3},{id:'note-1',type:'note',title:'A thought to keep',body:'Make tools feel like a place you want to return to.',project:'OpenCoven',created:7},{id:'note-2',type:'note',title:'An idea for the District',body:'A quiet courtyard. A little music. Somewhere to pause between adventures.',project:'River Oaks',created:5},{id:'link-1',type:'link',title:'AI that can stay.',url:'https://opencoven.ai',body:'The OpenCoven home.',project:'OpenCoven',created:6}],widgets:['focus','notes','tasks','reader'],timer:{duration:25,remaining:1500,running:false,end:0,completed:0,intent:'One thing at a time'},familiar:'Kitty',messages:{Kitty:[],Cody:[],Nova:[]}}}
let state=freshState(),storageAvailable=true;
function safeUrl(value){try{const u=new URL(value);return ['https:','http:'].includes(u.protocol)&&!u.username&&!u.password?u.href:null}catch{return null}}
function loadState(){try{const raw=localStorage.getItem(STORAGE_KEY);if(!raw)return;const saved=JSON.parse(raw);if(saved.version!==1||!Array.isArray(saved.items))return;state.items=saved.items.filter(i=>i&&typeof i.id==='string'&&['note','task','link'].includes(i.type)&&typeof i.title==='string'&&PROJECTS.includes(i.project)&&(i.type!=='link'||safeUrl(i.url))).map(i=>({id:i.id,type:i.type,title:i.title.slice(0,140),project:i.project,body:typeof i.body==='string'?i.body.slice(0,10000):'',url:i.type==='link'?safeUrl(i.url):'',done:!!i.done,created:Number(i.created)||0}));if(Array.isArray(saved.widgets))state.widgets=saved.widgets.filter(w=>WIDGETS.some(i=>i.id===w));if(['Kitty','Cody','Nova'].includes(saved.familiar))state.familiar=saved.familiar;if(saved.timer&&[15,25,45].includes(saved.timer.duration)){const t=saved.timer;state.timer={duration:t.duration,remaining:Math.max(0,Math.min(t.duration*60,Number(t.remaining)||0)),running:!!t.running&&Number.isFinite(t.end),end:Number(t.end)||0,completed:Math.max(0,Number(t.completed)||0),intent:typeof t.intent==='string'?t.intent.slice(0,140):'One thing at a time'}}for(const name of ['Kitty','Cody','Nova']){const m=saved.messages?.[name];if(Array.isArray(m))state.messages[name]=m.filter(x=>x&&['user','assistant'].includes(x.role)&&typeof x.text==='string').slice(-30).map(x=>({role:x.role,text:x.text.slice(0,6000)}));}}catch{storageAvailable=false}}
loadState();
function save(){try{localStorage.setItem(STORAGE_KEY,JSON.stringify(state));return true}catch{storageAvailable=false;toast('Browser storage is unavailable. Changes will last for this visit.');return false}}
let page='today',collection='all',project='all',query='',captureType='note',editingId=null,toastTimeout,lastFocus=null;
const screen=$('#screen'),dialog=$('#sheet');
function toast(message){$('#toast').textContent=message;$('#toast').classList.remove('hidden');clearTimeout(toastTimeout);toastTimeout=setTimeout(()=>$('#toast').classList.add('hidden'),4500)}
function timeLeft(){return state.timer.running?Math.max(0,Math.ceil((state.timer.end-Date.now())/1000)):state.timer.remaining}
function formatTime(n){return String(Math.floor(n/60)).padStart(2,'0')+':'+String(n%60).padStart(2,'0')}
function dateText(){return new Intl.DateTimeFormat('en-US',{weekday:'long',month:'short',day:'numeric'}).format(new Date())}
function localTime(zone){return new Intl.DateTimeFormat('en-US',{timeZone:zone,hour:'numeric',minute:'2-digit'}).format(new Date())}
function taskRow(item){return `<div class="task ${item.done?'done':''}"><button class="task-check" data-action="toggle-task" data-id="${esc(item.id)}" aria-label="${item.done?'Reopen':'Complete'} ${esc(item.title)}" aria-pressed="${!!item.done}"><span>${item.done?icon('check'):''}</span></button><button class="task-body" data-action="open-item" data-id="${esc(item.id)}"><span class="task-title">${esc(item.title)}</span><span class="meta"><i class="tag-dot" style="background:${item.project==='River Oaks'?'var(--pink)':item.project==='Personal'?'var(--green)':'var(--accent)'}"></i>${esc(item.project)}</span></button></div>`}
function linkRow(item){let host='';try{host=new URL(item.url).hostname}catch{}return `<button class="link-row" data-action="open-item" data-id="${esc(item.id)}"><span class="link-icon">${icon('book')}</span><span class="grow"><span class="title">${esc(item.title)}</span><span class="desc" style="display:block">${esc(host)} · ${esc(item.project)}</span></span>${icon('chevron')}</button>`}
function familiarSeal(name){return `<span class="familiar-symbol familiar-seal" data-familiar="${esc(name)}" aria-hidden="true"><span>${esc(name[0])}</span></span>`}
function renderNav(){$('.nav').innerHTML=[['today','home','Today'],['projects','projects','Projects'],['widgets','grid','Widgets'],['focus','focus','Focus'],['console','coven-mark','Console']].map(([id,ic,label])=>`<button data-action="nav" data-page="${id}" class="${page===id?'active':''}" ${page===id?'aria-current="page"':''}>${icon(ic)}<span>${label}</span></button>`).join('')}
function render(){renderNav();screen.setAttribute('aria-label',page==='today'?'Today':page[0].toUpperCase()+page.slice(1));screen.innerHTML=({today:renderToday,projects:renderProjects,widgets:renderWidgets,focus:renderFocus,console:renderConsole})[page]();updateTimerUI()}
function navigate(next){page=next;render();screen.scrollTop=0;screen.focus({preventScroll:true})}
function renderToday(){const tasks=state.items.filter(i=>i.type==='task');const latest=state.items.filter(i=>i.type==='note').sort((a,b)=>b.created-a.created)[0];const featured=latest;const links=state.items.filter(i=>i.type==='link');let tiles='';if(state.widgets.includes('focus'))tiles+=`<button class="widget-card" data-action="nav" data-page="focus"><span class="top">${icon('focus')} Focus</span><span class="timer-number" data-timer>${formatTime(timeLeft())}</span><span class="bottom"><span>${state.timer.running?'In your own rhythm':timeLeft()<state.timer.duration*60?'Return to your focus':'Make space to begin'}</span><span class="mini-play">${icon(state.timer.running?'pause':'play')}</span></span></button>`;if(state.widgets.includes('notes'))tiles+=`<button class="widget-card note-card" data-action="${featured?'open-item':'capture'}" ${featured?'data-id="'+esc(featured.id)+'"':'data-type="note"'}><span class="top">${icon('note')} Latest thought</span><p>${esc(featured?.body||'What’s on your mind?')}</p><span class="bottom"><span>${esc(featured?.project||'Your next idea')}</span>${icon('arrow')}</span></button>`;if(state.widgets.includes('clock'))tiles+=`<button class="widget-card" data-action="clock"><span class="top">${icon('clock')} World clock</span><span class="clock-big">${esc(localTime('America/Chicago'))}</span><span class="bottom">Houston · Local time</span></button>`;return `<div class="home-greeting"><p class="greeting-meta"><span>${esc(dateText())}</span><span class="maker-label">OpenCoven</span></p><span class="threshold-motif" aria-hidden="true">${icon('threshold')}</span><h1>Your space,<br><span style="color:var(--accent)">within reach.</span></h1></div><button class="capture-trigger" data-action="capture"><span class="capture-plus">${icon('plus')}</span><span>Capture a thought…</span>${icon('arrow')}</button>${tiles?`<section class="section"><div class="section-title"><h2>Your essentials</h2><button class="text-button" data-action="nav" data-page="widgets">Edit widgets</button></div><div class="widget-grid">${tiles}</div></section>`:''}${state.widgets.includes('tasks')?`<section class="section"><div class="section-title"><h2>Today’s priorities <span class="count">${tasks.filter(i=>i.done).length}/${tasks.length}</span></h2><button class="text-button" data-action="show-tasks">View all</button></div>${tasks.length?`<div class="task-list">${tasks.slice(0,3).map(taskRow).join('')}</div>`:`<button class="capture-trigger" data-action="capture" data-type="task">${icon('plus')} Add your first task</button>`}</section>`:''}<section class="section"><button class="familiar-banner" data-action="nav" data-page="console">${familiarSeal(state.familiar)}<span><h3>A familiar, by your side.</h3><p>${esc(state.familiar)} · Conversation preview</p></span>${icon('arrow')}</button></section>${state.widgets.includes('reader')&&links.length?`<section class="section"><div class="section-title"><h2>Saved for later</h2><button class="text-button" data-action="show-links">Reading list</button></div>${linkRow(links[0])}</section>`:''}<div class="caption">${icon('lock')} ${storageAvailable?'Saved on this device':'Session only'} <span>·</span> <button data-action="about" style="padding:8px 0;min-height:32px">Prototype</button></div>`}
function renderProjects(){return `<div class="page-heading row between"><div><div class="eyebrow">A place for everything</div><h1>Your projects.</h1></div><button class="add-button" data-action="capture" aria-label="Add an item">${icon('plus')}</button></div><div class="project-grid">${PROJECTS.slice(0,2).map((p,i)=>`<button class="project-card ${project===p?'active':''}" data-action="filter-project" data-project="${p}" aria-pressed="${project===p}"><span class="project-icon" style="${i?'color:var(--pink);background:#30252c':''}">${icon(i?'leaf':'coven-mark')}</span><h3>${p}</h3><p>${state.items.filter(x=>x.project===p).length} saved items</p></button>`).join('')}</div><div class="search-box">${icon('search')}<input id="item-search" type="search" placeholder="Find something you saved…" value="${esc(query)}" autocomplete="off" aria-label="Search saved items"></div><div class="row between" style="gap:8px"><div class="filters" aria-label="Collection filters" style="margin-top:0;flex:1">${[['all','All'],['note','Notes'],['task','Tasks'],['link','Links']].map(([v,label])=>`<button class="filter ${collection===v?'active':''}" data-action="filter-collection" data-value="${v}" aria-pressed="${collection===v}">${label}</button>`).join('')}</div></div><div class="row between" style="margin:-5px 0 14px"><span class="eyebrow">${project==='all'?'Everything you’ve kept':esc(project)}</span>${project!=='all'?'<button class="text-button" data-action="filter-project" data-project="all">Clear project</button>':''}</div><div id="collection-results">${renderResults()}</div><div class="caption">${icon('lock')} Local to this browser · No account sync</div>`}
function renderResults(){const results=state.items.filter(i=>(project==='all'||i.project===project)&&(collection==='all'||i.type===collection)&&[i.title,i.body,i.project,i.url].join(' ').toLowerCase().includes(query.toLowerCase())).sort((a,b)=>b.created-a.created);if(!results.length)return `<div class="empty">${icon('search')}<h3>${query?'Nothing here just yet.':'A little room to begin.'}</h3><p>${query?'Try another word, or clear your filters.':'Add a note, task, or link to this space.'}</p><button class="secondary-button" data-action="${query?'clear-filters':'capture'}">${query?'Clear search & filters':'Capture something'}</button></div>`;return `<div class="collection-list">${results.map(i=>i.type==='task'?`<div class="task-list">${taskRow(i)}</div>`:i.type==='link'?linkRow(i):`<button class="note-item" data-action="open-item" data-id="${esc(i.id)}"><h3>${esc(i.title)}</h3><p class="excerpt">${esc(i.body)}</p><span class="small muted" style="font-size:10px">${esc(i.project)} · Note</span></button>`).join('')}</div>`}
function renderWidgets(){return `<div class="page-heading"><div class="eyebrow">Thoughtfully chosen</div><h1>Your essentials.</h1><p>Only the tools you want to keep close.</p></div><div class="row between" style="margin:0 0 16px"><span class="eyebrow">Workspace widgets</span><span class="small muted">${state.widgets.length} added</span></div><div class="catalog-list">${WIDGETS.map(w=>`<article class="catalog-item"><div class="row"><span class="catalog-icon">${icon(w.icon)}</span><div class="grow"><h3>${w.name}</h3><span class="small muted" style="font-size:10px">Works on this device</span></div><button class="switch-hit" data-action="toggle-widget" data-id="${w.id}" role="switch" aria-checked="${state.widgets.includes(w.id)}" aria-label="${w.name}"><span class="switch" aria-hidden="true"></span></button></div><p>${w.desc}</p></article>`).join('')}</div><div class="widget-note">${icon('grid')}<p>A workspace that grows with you. Custom tool imports and connected providers will need the existing Open Sesame tool and host integrations.</p></div><button class="secondary-button" data-action="connection" style="width:100%;margin-top:13px">Explore desktop capabilities</button>`}
function renderFocus(){const t=state.timer;return `<div class="page-heading"><div class="eyebrow">One thing at a time</div><h1>Find your focus.</h1><p>One intention. A little room to begin.</p></div><div class="focus-hero"><div class="focus-ring"><svg viewBox="0 0 240 240" aria-hidden="true"><circle class="track" cx="120" cy="120" r="110"/><circle class="progress" cx="120" cy="120" r="110" id="timer-progress"/></svg><div class="focus-inside"><div class="eyebrow" id="timer-state">${t.running?'In focus':timeLeft()===0?'Well done':timeLeft()<t.duration*60?'Paused':'Ready when you are'}</div><div class="timer-number" data-timer>${formatTime(timeLeft())}</div><div class="small">${icon('leaf').replace('<svg','<svg style="width:13px;height:13px;vertical-align:-3px;margin-right:3px"')} Time, just for you</div></div></div><div class="durations" aria-label="Focus duration">${[15,25,45].map(m=>`<button data-action="duration" data-minutes="${m}" class="${t.duration===m?'active':''}" aria-pressed="${t.duration===m}" ${t.running?'disabled':''}>${m} min</button>`).join('')}</div></div><button class="focus-intent" data-action="intent">${icon('tasks')}<span class="grow"><span class="small">I’m making space for</span><h3>${esc(t.intent)}</h3></span>${icon('chevron')}</button><div class="focus-controls"><button class="primary" data-action="timer-toggle">${icon(t.running?'pause':'play')} ${t.running?'Pause session':timeLeft()===0?'Begin again':timeLeft()<t.duration*60?'Resume focus':'Begin focus'}</button><button class="secondary-button" data-action="timer-reset" aria-label="Reset focus timer">${icon('reset')}</button></div><div class="session-count">${icon('check')} ${t.completed} ${t.completed===1?'session':'sessions'} completed on this device</div><div class="notice" style="margin-top:30px">A local timer. Leave and come back — the countdown uses the clock. Sound, notifications, and music playback aren’t connected in this prototype.</div>`}
function renderConsole(){const name=state.familiar;const messages=state.messages[name];return `<div class="page-heading" style="margin-bottom:13px"><div class="row between"><div class="eyebrow">Coven familiars</div><span class="pill demo-label">Demo conversation</span></div><h1 style="margin-top:9px">Think together.</h1></div><div class="roster" aria-label="Choose a demo familiar">${['Kitty','Cody','Nova'].map((n,i)=>`<button data-action="familiar" data-name="${n}" class="${name===n?'active':''}" aria-pressed="${name===n}">${familiarSeal(n)}${n}</button>`).join('')}</div><div class="console-meta"><div class="row between"><div class="row" style="gap:8px">${icon('desktop')}<span class="small">Desktop companion</span></div><button class="text-button" data-action="connection" style="min-height:32px;padding:3px 0">Not connected ${icon('chevron').replace('<svg','<svg style="height:12px;width:12px;vertical-align:-2px"')}</button></div><p>Try the conversation flow below. Replies are scripted; no model or device is connected.</p></div>${!messages.length?`<div class="chat-intro">${familiarSeal(name)}<h2>A little help from ${name}.</h2><p>Bring an idea, a loose thread, or the thing you don’t know where to start.</p></div><div class="suggestions">${['Help me find my focus','Turn a thought into a next step','What can we do here?'].map(s=>`<button data-action="suggestion" data-prompt="${s}">${s}${icon('arrow')}</button>`).join('')}</div>`:''}<div id="messages" aria-live="polite">${messages.map(m=>`<div class="chat-message ${m.role}"><span class="message-label">${m.role==='user'?'You':name+' · scripted preview'}</span>${esc(m.text)}</div>`).join('')}</div><form id="chat-form" class="chat-composer"><label for="message-input" class="sr-only">Message ${name}</label><textarea id="message-input" placeholder="A thought for ${name}…" rows="1" maxlength="2000" autocomplete="off" required></textarea><button type="submit" aria-label="Send demo message">${icon('up')}</button></form><p class="chat-footnote">Demo only · No tool execution · Messages stay in this browser</p>`}
function updateTimerUI(){const left=timeLeft();document.querySelectorAll('[data-timer]').forEach(e=>e.textContent=formatTime(left));const ring=$('#timer-progress');if(ring)ring.style.strokeDashoffset=String(691.15*(1-left/(state.timer.duration*60)));}
function openSheet(title,body){lastFocus=document.activeElement;$('#sheet-content').innerHTML=`<div class="sheet-handle"></div><div class="sheet-title"><h2 id="sheet-heading">${esc(title)}</h2><button class="icon-button" data-action="close-sheet" aria-label="Close sheet">${icon('close')}</button></div>${body}`;if(!dialog.open)dialog.showModal();}
function closeSheet(){dialog.close();if(lastFocus?.isConnected)lastFocus.focus({preventScroll:true})}
function capture(type='note',id=null,prefill=null){captureType=type;editingId=id;const existing=state.items.find(i=>i.id===id);const item=existing||prefill||{title:'',body:'',url:'',project:PROJECTS.includes(project)?project:'OpenCoven'};openSheet(existing?'Keep it just right.':'Catch the thought.',`${!existing?`<div class="segmented" aria-label="Capture type">${[['note','note','Note'],['task','tasks','Task'],['link','link','Link']].map(([k,ic,label])=>`<button data-action="capture-type" data-type="${k}" class="${type===k?'active':''}" aria-pressed="${type===k}">${icon(ic)} ${label}</button>`).join('')}</div>`:''}<form id="capture-form"><label class="field"><span>${type==='task'?'What’s the next step?':'Give it a name'}</span><input id="capture-title" placeholder="${type==='note'?'A little idea…':type==='task'?'One thing to do…':'Something worth coming back to…'}" value="${esc(item.title)}" maxlength="140" autocomplete="off" required></label>${type==='link'?`<label class="field"><span>Website address</span><input id="capture-url" type="url" inputmode="url" placeholder="https://" value="${esc(item.url)}" autocomplete="off" required></label>`:''}${type!=='task'?`<label class="field"><span>${type==='note'?'Your thought':'A note for later (optional)'}</span><textarea id="capture-body" maxlength="10000" placeholder="Let it take shape…" autocomplete="off" ${type==='note'?'required':''}>${esc(item.body)}</textarea></label>`:''}<label class="field"><span>Keep it in</span><select id="capture-project">${PROJECTS.map(p=>`<option ${item.project===p?'selected':''}>${p}</option>`).join('')}</select></label><p id="capture-error" class="inline-error" role="alert"></p><button type="submit" class="primary">${icon('check')} ${existing?'Save changes':type==='task'?'Add task':type==='link'?'Save link':'Keep this thought'}</button><p class="sheet-footer">Saved on this device. No account sync or familiar access.</p></form>`)}
function readCapture(){return{title:$('#capture-title')?.value||'',body:$('#capture-body')?.value||'',url:$('#capture-url')?.value||'',project:$('#capture-project')?.value||'OpenCoven'}}
function openItem(id){const item=state.items.find(i=>i.id===id);if(!item)return;openSheet(item.title,`<div class="row" style="margin-bottom:20px"><span class="pill">${esc(item.project)}</span><span class="small muted">${item.type==='link'?'Saved link':item.type==='task'?'Task':'Note'}</span></div>${item.type==='task'?`<div class="task-list">${taskRow(item)}</div>`:`<p class="note-body">${esc(item.body)}</p>`}${item.type==='link'?`<a class="full-link" href="${esc(safeUrl(item.url))}" target="_blank" rel="noopener noreferrer">Open website ${icon('arrow')}</a>`:''}<div class="sheet-actions"><button class="secondary-button grow" data-action="edit-item" data-id="${esc(id)}">Edit ${item.type==='link'?'link':item.type}</button><button class="secondary-button danger" data-action="delete-prompt" data-id="${esc(id)}">Delete</button></div><p class="sheet-footer">Local to this prototype</p>`)}
function showAbout(){openSheet('A pocket-sized possibility.',`<span class="pill">Interactive mobile prototype · v0.3</span><div class="onboarding-list"><div class="row">${icon('note')}<div><h3>Capture. Keep. Come back.</h3><p>Create and edit notes, tasks, and links. Filter them by project and find them again with search.</p></div></div><div class="row">${icon('grid')}<div><h3>Make this space yours.</h3><p>Add or remove Today widgets. Set a focus intention and run a timer.</p></div></div><div class="row">${icon('spark')}<div><h3>Explore the familiar flow.</h3><p>Try scripted conversations with Kitty, Cody, and Nova. This is a proposed mobile experience, not a live familiar session.</p></div></div></div><div class="notice">No sign-in, cloud sync, microphone, shell, remote control, or real AI connection. Demo content and changes stay in this browser. This is a web prototype, not an installed iOS or Android app.</div><button class="primary" data-action="close-sheet">Make yourself at home</button>`)}
function showConnection(){openSheet('Your desktop, a little closer.',`<p class="small secondary" style="line-height:1.8">Open Sesame’s current machine tools live in its authenticated macOS companion. A secure phone-to-desktop connection is proposed work.</p><div class="connection-option"><div class="row">${icon('spark')}<h3>Familiars</h3></div><p>The real app discovers familiars through the installed Coven CLI. This prototype uses a sample roster and scripted replies.</p><span class="pill">Not connected</span></div><div class="connection-option"><div class="row">${icon('terminal')}<h3>Shells & remote desktops</h3></div><p>No machine session is available here. A mobile transport must enforce device identity, scoped permissions, revocation, and explicit approval at the authoritative host.</p><span class="pill">Desktop capability · Mobile proposed</span></div><div class="connection-option"><div class="row">${icon('lock')}<h3>Sign-in & sync</h3></div><p>Existing macOS WorkOS login does not establish mobile login or cross-device sync. There is no account connection in this prototype.</p><span class="pill">Not connected</span></div><button class="primary" data-action="close-sheet">Continue on this device</button>`)}
function showSettings(){openSheet('Your space.',`<div class="row" style="margin:20px 0"><span class="avatar" style="width:48px;height:48px;font-size:21px">V</span><div><h3>Val’s workspace</h3><p class="small muted">Sample profile · No account signed in</p></div></div><div class="settings-row"><span>Appearance</span><span class="value">Charcoal</span></div><div class="settings-row"><span>Saved data</span><span class="value">${storageAvailable?'This browser only':'Session only'}</span></div><button class="settings-row" style="width:100%;text-align:left" data-action="connection"><span>Desktop companion</span><span class="value">Not connected ${icon('chevron').replace('<svg','<svg style="width:12px;height:12px;vertical-align:-2px"')}</span></button><button class="settings-row" style="width:100%;text-align:left" data-action="about"><span>About this prototype</span>${icon('chevron')}</button><div class="sheet-actions"><button class="secondary-button grow" data-action="export">${icon('download').replace('<svg','<svg style="width:15px;height:15px;vertical-align:-3px;margin-right:5px"')}Export local data</button></div><button class="text-button danger" data-action="reset-prompt" style="width:100%;margin-top:10px">Reset the demo</button><p class="sheet-footer">Open Sesame by OpenCoven<br>AI that can stay.</p>`)}
function scriptedReply(text){if(/focus|priorit|start/i.test(text)){const next=state.items.find(i=>i.type==='task'&&!i.done);return `Let’s make a little room for one thing.${next?'\n\nYour first unfinished sample task is “'+next.title+'.”':''}\n\nChoose a step that fits into 25 minutes. Write down what “done” looks like, then open Focus when you’re ready.\n\nThis is a scripted preview; I haven’t started anything or changed your tasks.`}if(/next step|thought|idea/i.test(text))return 'Try this small frame:\n\nThe idea → What do you want to change?\nThe next step → What could you do in 15 minutes?\nThe result → What would you be able to see?\n\nUse quick capture to save the thought or make a task. This preview does not create it for you.';return 'In this prototype you can collect notes, tasks, and links, shape your Today screen with widgets, and make space with a focus timer.\n\nThese familiar conversations are scripted. A real conversation would require an authenticated connection to Coven and your exact familiar identity. Nothing here can run tools or grant permissions.'}
function sendMessage(text){text=text.trim();if(!text)return;state.messages[state.familiar].push({role:'user',text:text.slice(0,2000)},{role:'assistant',text:scriptedReply(text)});state.messages[state.familiar]=state.messages[state.familiar].slice(-30);save();render();screen.scrollTop=screen.scrollHeight;$('#message-input')?.focus({preventScroll:true})}
document.addEventListener('click',event=>{const target=event.target.closest('[data-action]');if(!target)return;const a=target.dataset.action,id=target.dataset.id;switch(a){case'home':navigate('today');break;case'nav':navigate(target.dataset.page);break;case'search':query='';project='all';collection='all';navigate('projects');$('#item-search').focus();break;case'capture':capture(target.dataset.type||'note');break;case'capture-type':{const draft=readCapture();capture(target.dataset.type,null,draft);break;}case'close-sheet':closeSheet();break;case'settings':showSettings();break;case'about':showAbout();break;case'connection':showConnection();break;case'open-item':openItem(id);break;case'edit-item':{const item=state.items.find(i=>i.id===id);if(item)capture(item.type,id);break;}case'delete-prompt':{const item=state.items.find(i=>i.id===id);if(item)openSheet('Let this one go?',`<p class="small secondary" style="line-height:1.8">Delete “${esc(item.title)}” from this prototype? This removes it from this browser.</p><div class="sheet-actions"><button class="secondary-button grow" data-action="open-item" data-id="${esc(id)}">Keep it</button><button class="secondary-button danger" data-action="delete-item" data-id="${esc(id)}">Delete item</button></div>`);break;}case'delete-item':state.items=state.items.filter(i=>i.id!==id);save();closeSheet();render();toast('Item deleted from this device.');break;case'toggle-task':{const item=state.items.find(i=>i.id===id);if(item){item.done=!item.done;save();render();if(dialog.open)openItem(id);toast(item.done?'A little progress. Task complete.':'Task reopened.')}break;}case'show-tasks':collection='task';project='all';query='';navigate('projects');break;case'show-links':collection='link';project='all';query='';navigate('projects');break;case'filter-project':project=project===target.dataset.project?'all':target.dataset.project;render();break;case'filter-collection':collection=target.dataset.value;render();break;case'clear-filters':query='';project='all';collection='all';render();break;case'toggle-widget':{const added=state.widgets.includes(id);state.widgets=added?state.widgets.filter(w=>w!==id):[...state.widgets,id];save();render();toast(added?'Widget removed from Today. Your data stays saved.':'Widget added to Today.');break;}case'duration':if(!state.timer.running){state.timer.duration=Number(target.dataset.minutes);state.timer.remaining=state.timer.duration*60;save();render();}break;case'timer-toggle':if(state.timer.running){state.timer.remaining=timeLeft();state.timer.running=false;state.timer.end=0;}else{if(!state.timer.remaining)state.timer.remaining=state.timer.duration*60;state.timer.end=Date.now()+state.timer.remaining*1000;state.timer.running=true;}save();render();break;case'timer-reset':state.timer.running=false;state.timer.end=0;state.timer.remaining=state.timer.duration*60;save();render();toast('A fresh start. Timer reset.');break;case'intent':openSheet('Make space for one thing.',`<form id="intent-form"><label class="field"><span>Your focus intention</span><input id="focus-intent-input" value="${esc(state.timer.intent)}" maxlength="140" autocomplete="off" required></label><button class="primary" type="submit">Keep this intention</button></form>`);break;case'familiar':state.familiar=target.dataset.name;save();render();break;case'suggestion':sendMessage(target.dataset.prompt);break;case'clock':openSheet('A little window elsewhere.',`<div class="settings-row"><span>Houston</span><span>${esc(localTime('America/Chicago'))}</span></div><div class="settings-row"><span>London</span><span>${esc(localTime('Europe/London'))}</span></div><p class="sheet-footer">Time from this device’s clock</p>`);break;case'export':{const snapshot=structuredClone(state);if(snapshot.timer.running)snapshot.timer.remaining=timeLeft();const blob=new Blob([JSON.stringify(snapshot,null,2)],{type:'application/json'});const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download='open-sesame-mobile-data.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000);toast('Download requested. Check your browser’s downloads.');break;}case'reset-prompt':openSheet('Start fresh?',`<p class="small secondary" style="line-height:1.8">This clears your prototype notes, tasks, links, conversations, and timer, then restores the sample workspace. Export anything you want to keep first.</p><div class="sheet-actions"><button class="secondary-button grow" data-action="settings">Keep my space</button><button class="secondary-button danger" data-action="reset-confirm">Reset prototype</button></div>`);break;case'reset-confirm':state=freshState();save();closeSheet();page='today';query='';project='all';collection='all';render();toast('Your sample workspace is ready.');break;}});
document.addEventListener('submit',event=>{if(event.target.id==='capture-form'){event.preventDefault();const draft=readCapture();draft.title=draft.title.trim();draft.body=draft.body.trim();if(!draft.title||captureType==='note'&&!draft.body){$('#capture-error').textContent='Add a title'+(captureType==='note'?' and a thought':'')+' before saving.';return}if(captureType==='link'){const url=safeUrl(draft.url);if(!url){$('#capture-error').textContent='Use an http or https address without a username or password.';return}draft.url=url}if(editingId){const item=state.items.find(i=>i.id===editingId);if(item)Object.assign(item,draft);}else state.items.push({id:uid(),type:captureType,...draft,done:false,created:Date.now()});save();closeSheet();render();toast(editingId?'Your changes are saved.':'A little thought, safely kept on this device.');}else if(event.target.id==='intent-form'){event.preventDefault();const value=$('#focus-intent-input').value.trim();if(!value)return;state.timer.intent=value;save();closeSheet();render();toast('Your focus intention is set.');}else if(event.target.id==='chat-form'){event.preventDefault();sendMessage($('#message-input').value)}});
document.addEventListener('input',event=>{if(event.target.id==='item-search'){query=event.target.value;$('#collection-results').innerHTML=renderResults()}});
dialog.addEventListener('click',event=>{if(event.target===dialog){const r=dialog.getBoundingClientRect();if(event.clientX<r.left||event.clientX>r.right||event.clientY<r.top||event.clientY>r.bottom)closeSheet()}});
function tick(){if(state.timer.running&&timeLeft()===0){state.timer.running=false;state.timer.remaining=0;state.timer.end=0;state.timer.completed+=1;save();render();toast('That was time well spent. Your focus session is complete.')}else updateTimerUI()}
document.addEventListener('visibilitychange',()=>{if(!document.hidden)tick()});
setInterval(tick,1000);tick();render();
</script>
