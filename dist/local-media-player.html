<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; media-src 'self' https: http:; script-src 'unsafe-inline'; style-src 'unsafe-inline'; connect-src 'none'"><title>Media player</title><style>html,body{margin:0;width:100%;height:100%;background:#101113;color:#d8d3df;font:13px system-ui}body{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px}video{width:100%;height:100%;min-height:0;object-fit:contain}body[data-kind=audio] video{height:60px;max-width:600px}#mark{display:none;font-size:44px;font-weight:300;color:#ab9cbd}body[data-kind=audio] #mark{display:block}#status{position:absolute;bottom:8px;left:12px;right:12px;font-size:11px;color:#afa6bc;pointer-events:none}video:focus-visible{outline:1px solid #bba4d0}</style></head><body data-kind="__KIND__"><span id="mark" aria-hidden="true">♫</span><video id="player" controls playsinline></video><p id="status" role="status"></p><script>'use strict';const config=__CONFIG__,player=document.getElementById('player'),status=document.getElementById('status');player.src=config.source;player.addEventListener('loadedmetadata',()=>{if(Number.isFinite(player.duration)&&player.duration>0)player.currentTime=Math.min(config.position,player.duration);if(config.playing)player.play().catch(()=>{status.textContent='Press Play to continue.'})},{once:true});player.addEventListener('play',()=>status.textContent='');player.addEventListener('error',()=>{status.textContent='This media could not play here. Return to the main player or choose another format.'});</script></body></html>
