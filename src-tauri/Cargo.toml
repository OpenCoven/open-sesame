[package]
name = "open-sesame"
version = "0.1.0"
description = "Open Sesame desktop application: the Tauri shell around the headless core."
edition.workspace = true
publish.workspace = true

[lib]
# A different name from the binary, so the two do not collide in the Windows build output.
name = "open_sesame_lib"

[dependencies]
open-sesame-core = { path = "../crates/core" }
serde_json = "1.0.154"
tauri = { version = "2.12.5", features = ["tray-icon"] }

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }
