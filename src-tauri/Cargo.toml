[package]
name = "open-sesame"
version = "0.1.0"
description = "Open Sesame desktop application: the Tauri shell around the headless core."
edition.workspace = true
publish.workspace = true

[lib]
# A different name from the binary, so the two do not collide in the Windows build output.
name = "open_sesame_lib"

[dependencies]
keyring = "4"
open-sesame-core = { path = "../crates/core" }
serde_json = "1.0.154"
tauri = { version = "2.12.5", features = ["tray-icon"] }
tauri-plugin-clipboard-manager = "2.5.0"
tauri-plugin-deep-link = "2"
tauri-plugin-dialog = "2.8.4"
tauri-plugin-global-shortcut = "2"
tauri-plugin-opener = "2.7.3"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
ureq = { version = "3", default-features = false, features = ["rustls"] }

[dev-dependencies]
# Test-only: Tauri's windowless runtime, so the command is tested behind Tauri's own request handling.
tauri = { version = "2.12.5", features = ["test"] }

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[target.'cfg(target_os = "macos")'.dependencies]
tauri-nspanel = "2"
