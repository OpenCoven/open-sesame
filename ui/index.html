<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark light">
<title>Open Sesame</title>
<link rel="stylesheet" href="./tokens.css">
<link rel="stylesheet" href="./shell.css">
<script type="module" src="./main.js"></script>
</head>
<body>
<svg class="sprite" aria-hidden="true" focusable="false">
  <symbol id="icon-mark" viewBox="0 0 20 20"><circle cx="10" cy="10" r="6.6"/><circle class="mark-core" cx="10" cy="10" r="2.3"/></symbol>
  <symbol id="icon-today" viewBox="0 0 20 20"><rect x="3.5" y="4.5" width="13" height="12" rx="2.6"/><path d="M3.5 8.5h13M7 3v3M13 3v3"/></symbol>
  <symbol id="icon-projects" viewBox="0 0 20 20"><path d="M3.5 6.5a2 2 0 0 1 2-2h2.6l1.8 2h4.6a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-9a2 2 0 0 1-2-2z"/></symbol>
  <symbol id="icon-focus" viewBox="0 0 20 20"><circle cx="10" cy="11" r="5.6"/><path d="M10 8v3l2 1.4M8 3.4h4"/></symbol>
  <symbol id="icon-shells" viewBox="0 0 20 20"><rect x="3" y="4.5" width="14" height="11" rx="2.6"/><path d="M6.5 8.4l2.2 1.8-2.2 1.8M10.6 12.2h3"/></symbol>
  <symbol id="icon-agents" viewBox="0 0 20 20"><rect x="4.5" y="7" width="11" height="8.5" rx="2.6"/><path d="M10 4v3M7.8 10.6v1.2M12.2 10.6v1.2M2.6 10.4v2.2M17.4 10.4v2.2"/></symbol>
  <symbol id="icon-reader" viewBox="0 0 20 20"><path d="M10 6.2c-1.6-1.2-3.6-1.6-6-1.4v9.6c2.4-.2 4.4.2 6 1.4 1.6-1.2 3.6-1.6 6-1.4V4.8c-2.4-.2-4.4.2-6 1.4zM10 6.2v9.6"/></symbol>
  <symbol id="icon-github" viewBox="0 0 20 20"><circle cx="6" cy="5.4" r="1.8"/><circle cx="6" cy="14.6" r="1.8"/><circle cx="14" cy="7.4" r="1.8"/><path d="M6 7.2v5.6M14 9.2c0 2.2-1.8 3-4 3.2-1.6.1-2.8.3-4 .9"/></symbol>
  <symbol id="icon-familiars" viewBox="0 0 20 20"><path d="M4 6.5A2.5 2.5 0 0 1 6.5 4h7A2.5 2.5 0 0 1 16 6.5v4a2.5 2.5 0 0 1-2.5 2.5H9.6L6 16v-3.1a2.5 2.5 0 0 1-2-2.4z"/></symbol>
  <symbol id="icon-local-media" viewBox="0 0 20 20"><circle cx="10" cy="10" r="6.6"/><path d="M8.6 7.4l4 2.6-4 2.6z"/></symbol>
  <symbol id="icon-desktops" viewBox="0 0 20 20"><rect x="3" y="4.5" width="14" height="9" rx="2.2"/><path d="M7.5 16.5h5M10 13.5v3"/></symbol>
  <symbol id="icon-transcription" viewBox="0 0 20 20"><rect x="7.8" y="3.4" width="4.4" height="8" rx="2.2"/><path d="M5 10a5 5 0 0 0 10 0M10 15v2"/></symbol>
  <symbol id="icon-declarative" viewBox="0 0 20 20"><path d="M7.5 4.5c-1.6 0-2 .8-2 2v1.8c0 .9-.6 1.5-1.5 1.7 .9.2 1.5.8 1.5 1.7v1.8c0 1.2.4 2 2 2M12.5 4.5c1.6 0 2 .8 2 2v1.8c0 .9.6 1.5 1.5 1.7-.9.2-1.5.8-1.5 1.7v1.8c0 1.2-.4 2-2 2"/></symbol>
  <symbol id="icon-commands" viewBox="0 0 20 20"><circle cx="9" cy="9" r="5"/><path d="M12.8 12.8l3.4 3.4"/></symbol>
  <symbol id="icon-settings" viewBox="0 0 20 20"><path d="M4 6.5h6M14 6.5h2M4 13.5h2M10 13.5h6"/><circle cx="12" cy="6.5" r="1.9"/><circle cx="8" cy="13.5" r="1.9"/></symbol>
  <symbol id="icon-collapse" viewBox="0 0 20 20"><path d="M8 5l5 5-5 5"/></symbol>
  <symbol id="icon-wide" viewBox="0 0 20 20"><path d="M8 6l-4 4 4 4M12 6l4 4-4 4"/></symbol>
</svg>
<template id="icon-template"><svg class="icon" aria-hidden="true" focusable="false"><use></use></svg></template>
<main class="shell" data-state="connecting" data-presentation="window" data-rail="expanded" data-edge="right" aria-busy="true">
  <nav class="rail" aria-label="Views">
    <div class="rail-inner">
      <button type="button" class="rail-button rail-mark" data-rail-toggle aria-controls="panel" aria-expanded="true" title="Open Sesame">
        <svg class="icon" aria-hidden="true" focusable="false"><use href="#icon-mark"></use></svg>
        <span class="label-hidden" data-rail-toggle-label>Open Sesame</span>
      </button>
      <div class="rail-views" data-navigation></div>
      <div class="rail-tools">
        <button type="button" class="rail-button" data-palette-toggle aria-expanded="false" aria-controls="command-palette" title="Commands">
          <svg class="icon" aria-hidden="true" focusable="false"><use href="#icon-commands"></use></svg>
          <span class="label-hidden">Commands</span>
        </button>
        <button type="button" class="rail-button" data-widgets-toggle aria-expanded="false" aria-controls="widget-settings" title="Settings">
          <svg class="icon" aria-hidden="true" focusable="false"><use href="#icon-settings"></use></svg>
          <span class="label-hidden">Settings</span>
        </button>
      </div>
      <span class="label-hidden" role="status" data-attention-status></span>
    </div>
  </nav>
  <section class="panel" id="panel" data-panel aria-label="Open Sesame">
    <header class="bar">
      <div class="bar-title">
        <h1 data-view-title>Open Sesame</h1>
        <p class="status" role="status" data-status>Connecting to this machine.</p>
      </div>
      <button type="button" class="bar-button" data-wide-toggle aria-pressed="false" title="Wide panel" hidden>
        <svg class="icon" aria-hidden="true" focusable="false"><use href="#icon-wide"></use></svg>
        <span class="label-hidden">Wide panel</span>
      </button>
      <button type="button" class="bar-button" data-collapse title="Close the panel" hidden>
        <svg class="icon" aria-hidden="true" focusable="false"><use href="#icon-collapse"></use></svg>
        <span class="label-hidden">Close the panel</span>
      </button>
    </header>
    <p role="status" class="notice" data-shell-notice hidden></p>
    <div class="panel-body">
      <section id="command-palette" class="palette" aria-label="Commands" hidden>
        <label>Find a command <input type="search" data-command-query autocomplete="off" spellcheck="false" placeholder="Type a command, a note or a sum"></label>
        <div class="command-results" data-command-results></div>
        <button type="button" data-palette-close>Close commands</button>
      </section>
      <section id="widget-settings" class="sheet" aria-label="Settings" hidden>
        <div class="settings" data-settings hidden>
          <section class="account" data-account hidden aria-labelledby="account-title">
            <h2 id="account-title">Account</h2>
            <p class="who" role="status" data-account-title></p>
            <p class="message" data-account-detail></p>
            <div class="row">
              <button type="button" data-account-sign-in hidden>Sign in</button>
              <button type="button" data-account-cancel hidden>Cancel sign-in</button>
              <button type="button" data-account-sign-out hidden>Sign out</button>
            </div>
          </section>
          <section class="summon" data-summon hidden aria-labelledby="summon-title">
            <h2 id="summon-title">Shortcut</h2>
            <form data-summon-form>
              <label for="summon-shortcut">Keys that show or hide Open Sesame from anywhere</label>
              <div class="row">
                <input id="summon-shortcut" name="shortcut" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" aria-describedby="summon-hint">
                <button type="submit">Save</button>
              </div>
            </form>
            <p class="hint" id="summon-hint" data-summon-hint></p>
            <p class="message" role="status" data-summon-message></p>
            <label class="check"><input type="checkbox" data-summon-blur> <span data-summon-blur-label>Hide the window when it loses focus</span></label>
          </section>
          <section class="rail-settings" data-rail-settings hidden aria-labelledby="rail-title">
            <h2 id="rail-title">Rail</h2>
            <label class="field" for="rail-edge">Edge of the screen
              <select id="rail-edge" data-rail-edge>
                <option value="right">Right</option>
                <option value="left">Left</option>
              </select>
            </label>
            <label class="check"><input type="checkbox" data-rail-hover> Open when the pointer rests on the rail</label>
            <p class="message" role="status" data-rail-message></p>
          </section>
        </div>
        <section class="widget-settings" aria-labelledby="widgets-title">
          <h2 id="widgets-title">Widgets</h2>
          <p class="hint">Turn widgets on to use them. Turning one off closes its activity.</p>
          <div data-widget-options></div>
        </section>
      </section>
      <div class="view-host" data-view-host></div>
      <p class="empty" data-empty hidden>All widgets are off. Open Settings or choose a command to turn one on.</p>
    </div>
  </section>
</main>
</body>
</html>
