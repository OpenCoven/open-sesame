<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Open Sesame</title>
<link rel="stylesheet" href="./shell.css">
<script type="module" src="./main.js"></script>
</head>
<body>
<main class="shell" data-state="connecting">
  <h1>Open Sesame</h1>
  <p class="status" role="status" data-status>Connecting to this machine.</p>
  <dl class="facts" data-facts hidden>
    <div><dt>System</dt><dd data-fact="platform"></dd></div>
    <div><dt>Version</dt><dd data-fact="version"></dd></div>
  </dl>
  <section class="account" data-account hidden aria-labelledby="account-title">
    <h2 id="account-title">Account</h2>
    <p class="who" role="status" data-account-title></p>
    <p class="message" data-account-detail></p>
    <div class="row">
      <button type="button" data-account-sign-in hidden>Sign in</button>
      <button type="button" data-account-cancel hidden>Cancel sign-in</button>
      <button type="button" data-account-sign-out hidden>Sign out</button>
    </div>
  </section>
  <section class="summon" data-summon hidden aria-labelledby="summon-title">
    <h2 id="summon-title">Shortcut</h2>
    <form data-summon-form>
      <label for="summon-shortcut">Keys that show or hide Open Sesame from anywhere</label>
      <div class="row">
        <input id="summon-shortcut" name="shortcut" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" aria-describedby="summon-hint">
        <button type="submit">Save</button>
      </div>
    </form>
    <p class="hint" id="summon-hint" data-summon-hint></p>
    <p class="message" role="status" data-summon-message></p>
    <label class="check"><input type="checkbox" data-summon-blur> Hide the window when it loses focus</label>
  </section>
</main>
</body>
</html>
