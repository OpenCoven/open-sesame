<!doctype html><html><head><meta charset="utf-8"><title>Paper reader checks</title><link rel="stylesheet" href="design-tokens.css"><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="pdf-viewer.css"><style>body{background:#18181c;padding:20px}#pdf-prose{background:#efece6;max-width:840px;border-radius:12px}#results{color:white;white-space:pre-wrap}#sizes{margin:10px;display:flex;gap:8px}</style><script src="vendor/purify.min.js"></script><script src="vendor/marked.js"></script><script src="paper-reader.js"></script></head><body><div id="results" role="status">Checking…</div><div id="sizes"><button data-size="840">Desktop</button><button data-size="420">Compact</button></div><article id="pdf-prose"></article><script>
(async()=>{const host=document.querySelector('#pdf-prose'),result=document.querySelector('#results'),checks=[];function check(condition,name){checks.push((condition?'PASS':'FAIL')+' '+name)}
const text=await(await fetch('qa-paper-content.html')).text(),parsed=OpenSesamePaper.article(text,location.href);host.append(parsed.fragment);OpenSesamePaper.wireFigures(host);await OpenSesamePaper.typeset(host);
check(host.querySelectorAll('table tr').length===5,'semantic table with grouped headers and 3 data rows');check(host.querySelector('[colspan="2"]')&&host.querySelector('[rowspan="2"]'),'spanning cells preserved');check(host.querySelectorAll('.paper-svg-label').length===5,'all diagram labels preserved');check(getComputedStyle(host.querySelector('.paper-diagram rect')).fill==='rgb(236, 229, 251)','SVG stylesheet color retained');check(host.querySelector('.paper-diagram').getBoundingClientRect().width>400,'diagram uses available width');check(host.querySelectorAll('.paper-list-marker').length===2&&getComputedStyle(host.querySelector('li')).listStyleType==='none','no duplicate bullet markers');check(getComputedStyle(host.querySelector('.ltx_listingline')).whiteSpace==='pre','code indentation preserved');check(host.querySelector('.ltx_listingline:last-child').textContent.includes('        return'),'leading spaces preserved');check(!host.querySelector('.ltx_listing_data'),'download arrow excluded');check(host.querySelector('mjx-container svg'),'TeX still renders');const again=OpenSesamePaper.clean(host.innerHTML,location.href);check(again.querySelectorAll('.paper-svg-label').length===5,'labels survive repeated clean');
const dirty=OpenSesamePaper.clean('<svg><foreignObject x="0" y="0" width="30" height="30"><div onclick="alert(1)">label<img src="x" onerror="alert(1)"><iframe src="javascript:alert(1)"></iframe></div></foreignObject></svg><script>alert(1)<\/script>',location.href);check(!dirty.querySelector('script,iframe,img,[onclick],[onerror]'),'diagram labels remain inert');result.textContent=checks.join('\n');for(const b of document.querySelectorAll('[data-size]'))b.onclick=()=>host.style.maxWidth=b.dataset.size+'px';})();
</script></body></html>
