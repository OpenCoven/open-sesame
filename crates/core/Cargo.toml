[package]
name = "open-sesame-core"
version = "0.1.0"
description = "Open Sesame's headless core: wire protocol, request gate and local storage. No Tauri dependency."
edition.workspace = true
publish.workspace = true

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
# SQLite is compiled in ("bundled") so every operating system runs the same version.
rusqlite = { version = "0.42.0", features = ["bundled"] }
uuid = { version = "1.29.2", features = ["v7"] }

[dev-dependencies]
tempfile = "3.27.0"
