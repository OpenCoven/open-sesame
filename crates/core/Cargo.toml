[package]
name = "open-sesame-core"
version = "0.1.0"
description = "Open Sesame's headless core: wire protocol and request gate. No Tauri dependency."
edition.workspace = true
publish.workspace = true

[dependencies]
gethostname = "1.1.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[dev-dependencies]
tempfile = "3.27.0"

[target."cfg(unix)".dependencies]
libc = "0.2.191"

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_System_Diagnostics_ToolHelp"] }
