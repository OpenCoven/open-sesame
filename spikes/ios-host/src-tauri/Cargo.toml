[package]
name = "ios-host-spike"
version = "0.0.1"
edition = "2021"
publish = false

[lib]
name = "ios_host_spike_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_os = "ios")'.dependencies]
core-foundation = "0.10"
