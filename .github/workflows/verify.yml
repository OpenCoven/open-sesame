name: Development verification

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Install process inspection on Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y lsof
      - name: Select Xcode with Swift 6.2 or newer
        if: runner.os == 'macOS'
        run: |
          test -d /Applications/Xcode_26.3.app/Contents/Developer
          echo 'DEVELOPER_DIR=/Applications/Xcode_26.3.app/Contents/Developer' >> "$GITHUB_ENV"
          DEVELOPER_DIR=/Applications/Xcode_26.3.app/Contents/Developer xcrun swiftc --version
      - name: Verify portable behavior
        if: runner.os == 'Linux'
        run: npm run verify -- --portable
      - name: Verify Mac behavior and compile/sign bundle
        if: runner.os == 'macOS'
        run: npm run verify
      - name: Retain executed-check evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: verification-${{ matrix.os }}
          path: build/verification/
          if-no-files-found: error
          retention-days: 14

  # The Rust workspace of the desktop restart (epic #58, issue #68). It runs on all three systems
  # from the first Rust commit, so a break on one of them shows up in the pull request that
  # causes it. Every step runs on every system except the Linux package install; cargo is run
  # directly, not through scripts/run_bounded.py, because that script uses os.waitid, which
  # Windows does not have.
  rust:
    name: Rust workspace (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        # Explicit, so Windows uses bash too and every pipeline fails when any part of it fails
        # (GitHub runs an explicit bash with -eo pipefail).
        shell: bash
    env:
      # The toolchain the local evidence for the restart was produced with. Raise it on purpose,
      # in a change of its own: a new clippy can add lints, and warnings are errors here.
      RUST_TOOLCHAIN: '1.95.0'
      CARGO_TERM_COLOR: never
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      # Package list: the Debian block of https://v2.tauri.app/start/prerequisites/ (page last
      # updated 20 August 2026, read 13 November 2026). It is the page's full list, which is
      # longer than the one in the restart plan. The tray package is libayatana-appindicator3-dev.
      - name: Install the Tauri system packages on Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - name: Install the Rust toolchain
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component rustfmt --component clippy --no-self-update
          rustup default "$RUST_TOOLCHAIN"
          mkdir -p build/verification/rust
          { rustc --version --verbose; cargo --version; } | tee build/verification/rust/toolchain.txt
      - name: Cache the Cargo registry and build output
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: cargo-${{ matrix.os }}-${{ env.RUST_TOOLCHAIN }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-${{ matrix.os }}-${{ env.RUST_TOOLCHAIN }}-
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Lint with warnings as errors
        run: cargo clippy --workspace --all-targets --locked -- -D warnings 2>&1 | tee build/verification/rust/clippy.log
      - name: Test the workspace
        run: cargo test --workspace --locked 2>&1 | tee build/verification/rust/test.log
      - name: Build the app
        run: cargo build --package open-sesame --locked 2>&1 | tee build/verification/rust/build.log
      - name: Retain executed-check evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rust-verification-${{ matrix.os }}
          path: build/verification/rust/
          if-no-files-found: error
          retention-days: 14
