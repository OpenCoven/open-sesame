name: Development verification

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Install process inspection on Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y lsof
      - name: Select Xcode with Swift 6.2 or newer
        if: runner.os == 'macOS'
        run: |
          test -d /Applications/Xcode_26.3.app/Contents/Developer
          echo 'DEVELOPER_DIR=/Applications/Xcode_26.3.app/Contents/Developer' >> "$GITHUB_ENV"
          DEVELOPER_DIR=/Applications/Xcode_26.3.app/Contents/Developer xcrun swiftc --version
      - name: Verify portable behavior
        if: runner.os == 'Linux'
        run: npm run verify -- --portable
      - name: Verify Mac behavior and compile/sign bundle
        if: runner.os == 'macOS'
        run: npm run verify
      - name: Retain executed-check evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: verification-${{ matrix.os }}
          path: build/verification/
          if-no-files-found: error
          retention-days: 14
